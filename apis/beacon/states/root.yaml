get:
  operationId: "getStateRoot"
  summary: "Get state SSZ HashTreeRoot"
  description: "Calculates HashTreeRoot for state with given 'stateId'. If stateId is root, same value will be returned."
  tags:
    - Beacon
  parameters:
    - name: state_id
      in: path
      $ref: '../../../beacon-node-oapi.yaml#/components/parameters/StateId'
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            title: GetStateRootResponse
            type: object
            required: [execution_optimistic, finalized, data]
            properties:
              execution_optimistic:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ExecutionOptimistic"
              finalized:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Finalized"
              data:
                type: object
                required: [root]
                properties:
                  root:
                    $ref: '../../../beacon-node-oapi.yaml#/components/schemas/Root'
                    description: HashTreeRoot of BeaconState object
    "400":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/InvalidStateId'
    "404":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/StateNotFound'
    "500":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/InternalError'
