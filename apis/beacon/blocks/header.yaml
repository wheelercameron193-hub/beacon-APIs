get:
  operationId: getBlockHeader
  summary: Get block header
  description: Retrieves block header for given block id.
  tags:
    - Beacon
  parameters:
    - name: block_id
      in: path
      required: true
      $ref: '../../../beacon-node-oapi.yaml#/components/parameters/BlockId'
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            title: GetBlockHeaderResponse
            type: object
            required: [execution_optimistic, finalized, data]
            properties:
              execution_optimistic:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/ExecutionOptimistic"
              finalized:
                $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Finalized"
              data:
                type: object
                required: [root, canonical, header]
                properties:
                  root:
                    $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Root"
                  canonical:
                    type: boolean
                  header:
                    $ref: "../../../beacon-node-oapi.yaml#/components/schemas/Phase0.SignedBeaconBlockHeader"
    "400":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/InvalidBlockId'
    "404":
      $ref: '../../../beacon-node-oapi.yaml#/components/responses/BlockNotFound'
    "500":
      $ref: "../../../beacon-node-oapi.yaml#/components/responses/InternalError"
